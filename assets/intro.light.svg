<svg xmlns="http://www.w3.org/2000/svg" width="840" height="232" viewBox="0 0 840 232" role="img" aria-label="Ayushman Gupta, full-stack engineer in Hyderabad, India. I’m making Seqora, a database client, because every one I used took ages to open. Before that, Stash, for the articles I save and never read. Day job at Skillsoft, in edtech. When I’m not building, I’m reading about astronomy or sketching ideas to think better."><title>Ayushman Gupta, full-stack engineer in Hyderabad, India. I’m making Seqora, a database client, because every one I used took ages to open. Before that, Stash, for the articles I save and never read. Day job at Skillsoft, in edtech. When I’m not building, I’m reading about astronomy or sketching ideas to think better.</title><style>@font-face{font-family:"medium";src:url(data:font/woff2;base64,) format("woff2")}.medium{font-family:"medium",Helvetica, Arial, sans-serif}@font-face{font-family:"sans";src:url(data:font/woff2;base64,) format("woff2")}.sans{font-family:"sans",Helvetica, Arial, sans-serif}</style><text x="0.0" y="22.0" class="medium" font-size="17" fill="#1B1A17">Ayushman Gupta</text><text x="0.0" y="46.0" class="sans" font-size="15" fill="#8C877E">Full-stack engineer in Hyderabad, India</text><text x="0.0" y="92.0" class="sans" font-size="16" fill="#57534C">I’m making Seqora, a database client, because every one I used took ages to</text><text x="0.0" y="118.0" class="sans" font-size="16" fill="#57534C">open. Before that, Stash, for the articles I save and never read. Day job at</text><text x="0.0" y="144.0" class="sans" font-size="16" fill="#57534C">Skillsoft, in edtech.</text><text x="0.0" y="184.0" class="sans" font-size="16" fill="#57534C">When I’m not building, I’m reading about astronomy or sketching ideas to think</text><text x="0.0" y="210.0" class="sans" font-size="16" fill="#57534C">better.</text></svg>
