<svg xmlns="http://www.w3.org/2000/svg" width="840" height="398" viewBox="0 0 840 398" role="img" aria-label="Projects. Seqora, since July 2026, built with Rust, Svelte and Tauri: A desktop database client for PostgreSQL, MySQL, MariaDB, SQLite and SQL Server. No account, no cloud in the middle. Your queries go straight from your machine to your database. I make it on my own. There is no team. The four questions: Which connection am I on? Will this change data? What just ran? How does this table relate to that one?"><title>Projects. Seqora, since July 2026, built with Rust, Svelte and Tauri: A desktop database client for PostgreSQL, MySQL, MariaDB, SQLite and SQL Server. No account, no cloud in the middle. Your queries go straight from your machine to your database. I make it on my own. There is no team. The four questions: Which connection am I on? Will this change data? What just ran? How does this table relate to that one?</title><style>@font-face{font-family:"italic";src:url(data:font/woff2;base64,) format("woff2")}.italic{font-family:"italic",Georgia, serif}@font-face{font-family:"medium";src:url(data:font/woff2;base64,) format("woff2")}.medium{font-family:"medium",Helvetica, Arial, sans-serif}@font-face{font-family:"mono";src:url(data:font/woff2;base64,) format("woff2")}.mono{font-family:"mono",Menlo, monospace}@font-face{font-family:"sans";src:url(data:font/woff2;base64,) format("woff2")}.sans{font-family:"sans",Helvetica, Arial, sans-serif}</style><line x1="0" y1="0.5" x2="840" y2="0.5" stroke="#E4E0D8"/><text x="0.0" y="44.0" class="sans" font-size="13.5" fill="#8C877E">Projects</text><g transform="translate(0 85) scale(0.1389) translate(-3 -12)" fill="#1B1A17"><path d="M12 12H96V30H30V84H84V48H102V102H12Z"/><path d="M84 101H102V120H84Z"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="0.9s"/><animateTransform attributeName="transform" type="translate" values="0 -18;0 -18;0 0" keyTimes="0;0.5;1" dur="0.9s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/></path></g><text x="24.0" y="99.0" class="medium" font-size="16.5" fill="#1B1A17">Seqora</text><text x="840.0" y="99.0" class="mono" font-size="12.5" fill="#8C877E" text-anchor="end">seqora.dev</text><text x="0.0" y="126.0" class="sans" font-size="16" fill="#57534C">A desktop database client for PostgreSQL, MySQL, MariaDB, SQLite and SQL</text><text x="0.0" y="152.0" class="sans" font-size="16" fill="#57534C">Server. No account, no cloud in the middle. Your queries go straight from your</text><text x="0.0" y="178.0" class="sans" font-size="16" fill="#57534C">machine to your database. I make it on my own. There is no team.</text><text x="840.0" y="126.0" class="mono" font-size="12.5" fill="#8C877E" text-anchor="end">Rust · Svelte · Tauri</text><text x="840.0" y="152.0" class="mono" font-size="12.5" fill="#8C877E" text-anchor="end">since July 2026</text><text x="0.0" y="228.0" class="sans" font-size="13.5" fill="#8C877E">The four questions</text><text x="0.0" y="270.0" class="italic" font-size="26" fill="#1B1A17">Which connection am I on?</text><text x="0.0" y="304.0" class="italic" font-size="26" fill="#1B1A17">Will this change data?</text><text x="0.0" y="338.0" class="italic" font-size="26" fill="#1B1A17">What just ran?</text><text x="0.0" y="372.0" class="italic" font-size="26" fill="#1B1A17">How does this table relate to that one?</text></svg>
